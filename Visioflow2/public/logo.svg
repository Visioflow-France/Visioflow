<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <!-- Bras gauche du V — courbe organique, légèrement asymétrique -->
  <path d="M5,7 C8,7 13,17 17,25 C19.5,30 21,33 22,36"
        stroke="#0071E3" stroke-width="3.4" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bras droit du V — légèrement différent pour éviter la symétrie parfaite -->
  <path d="M39,7 C36,7 31,17 27,25 C24.5,30 23,33 22,36"
        stroke="#0071E3" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vague flow en dessous — l'accent qui donne la personnalité -->
  <path d="M15,41 Q18.5,38.5 22,41 Q25.5,38.5 29,41"
        stroke="#38bdf8" stroke-width="2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
